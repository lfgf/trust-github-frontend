name: Publish NPM Package

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Bump Version
        run: |
          cd projects/trust-github
          npm version patch --no-git-tag-version

      - name: Build Library
        run: npm run build

      - name: Publish to NPM
        run: |
          cd dist/trust-github
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit bumped version
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add projects/trust-github/package.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: bump version [skip ci]"
          git push

      - name: Update Monolith
        run: |
          cd ..
          git clone https://${{ secrets.PAT_TOKEN }}@github.com/lfgf/kojinx.git kojinx-frontend
          cd kojinx-frontend
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          cd kojinx-frontend
          npm install @kojinx/github@latest
          
          cd ..
          git add kojinx-frontend/package.json kojinx-frontend/package-lock.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: bump @kojinx/github to latest"
          git push origin main
